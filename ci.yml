name: Pomodoro CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project files
        run: |
          test -f app/index.html
          test -f app/style.css
          test -f app/script.js
          test -f docker/Dockerfile
          echo "Project files are present."

      - name: Build Docker image
        run: docker build -t pomodoro-timer:ci -f docker/Dockerfile .

      - name: Start container
        run: docker run -d --name pomodoro-test -p 8080:80 pomodoro-timer:ci

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs pomodoro-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f pomodoro-test
